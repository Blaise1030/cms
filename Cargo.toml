[package]
name = "workbench"
version = "0.1.0"
edition = "2021"
description = "Local Lovable-style site builder daemon"

[lib]
name = "workbench"
path = "src/lib.rs"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "multipart", "query", "ws"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2"
rand = "0.10.3"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "sync", "rt", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
futures-util = "0.3"
portable-pty = "0.9.0"

sha2 = "0.10"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.29"
