# Build the static Astro site and deploy it to Cloudflare Pages.
#
#   push to main          -> production deploy.
#   pull request (opened, -> preview deploy of the PR head commit (`--branch=<head_ref>`, the name
#   updated, reopened)       sanitised by .github/scripts/pages-branch.sh), recorded as a
#                            GitHub deployment of the PR head SHA whose status carries the preview
#                            URL (`environment_url`), plus one sticky PR comment with the link.
#                            The CMS workbench reads that deployment to show "Preview" next to the
#                            PR status in its browser bar.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secrets:   CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#              CLOUDFLARE_ACCOUNT_ID
#   variables: CLOUDFLARE_PAGES_PROJECT (optional; defaults to `name` in wrangler.toml)
# No other repo settings: the job requests the token permissions it needs (contents: read,
# deployments: write, pull-requests: write). PRs from forks get no secrets and are skipped.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'astro-marketing' }}
    steps:
      # On a PR, build the head commit (not the merge commit): that is the SHA the deployment
      # is recorded for.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Pages branch: the PR head branch for previews, the pushed branch otherwise. Branch names
      # are untrusted, so only the sanitised name is used below (never the raw ref).
      - name: Pages branch name
        id: branch
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(bash .github/scripts/pages-branch.sh "$RAW_BRANCH")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on content-schema errors and missing section ids.
      - run: npm run build

      - name: Start GitHub deployment (preview)
        id: deployment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PAGES_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `preview/${process.env.PAGES_BRANCH}`,
              transient_environment: true,
              production_environment: false,
              auto_merge: false,
              required_contexts: [],
              description: "Cloudflare Pages preview",
            });
            core.setOutput("id", data.id);

      - name: Deploy ./dist to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="${{ env.PAGES_PROJECT }}" --branch="${{ steps.branch.outputs.name }}"

      - name: Publish preview URL (deployment status + sticky PR comment)
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_OUTCOME: ${{ steps.pages.outcome }}
          # The branch alias (stable per branch) when Pages reports one, else this deploy's URL.
          PREVIEW_URL: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
        with:
          script: |
            const ok = process.env.DEPLOY_OUTCOME === "success" && !!process.env.PREVIEW_URL;
            const url = process.env.PREVIEW_URL;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? "success" : "failure",
              ...(ok ? { environment_url: url } : {}),
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });

            const marker = "<!-- cms-preview-deploy -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = ok
              ? `${marker}\n**Preview:** ${url}\n\nDeployed from ${sha}.`
              : `${marker}\n**Preview deploy failed** for ${sha}. See the workflow run for details.`;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
