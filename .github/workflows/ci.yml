name: CI

# Every push and pull request checks the daemon, the web app, the template and the
# orso-astro package, then runs the Playwright smoke e2e against a real daemon.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The daemon spawns agents, dev servers and git; test on both platforms.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The daemon embeds web/dist, so it must exist before Rust compiles.
      - name: Build the web app
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Content tests run packages/astro's real `POST /__orso` endpoint in a fake dev server;
      # template and scaffold tests copy templates/astro-marketing. Both need node_modules.
      - name: Install content package deps
        run: npm --prefix packages/astro ci
      - name: Install template deps
        run: npm --prefix templates/astro-marketing ci
      - name: Test
        run: cargo test --locked

  # The ignored real-npm tests: a scaffolded project's `npm ci` + `astro build`, and a save
  # through a real Astro dev server's `orso()` integration. Other ignored tests stay out.
  real-astro:
    name: Real Astro (scaffold + content save)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The daemon embeds web/dist, so it must exist before Rust compiles.
      - name: Build the web app
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Install content package deps
        run: npm --prefix packages/astro ci
      - name: Scaffold, npm ci and astro build
        run: cargo test --locked --test projects -- --ignored --exact real_npm_install_and_site_builds
      - name: Save through a real Astro dev server
        run: cargo test --locked --test content_e2e -- --ignored --exact real_astro_saves_content_through_the_integration

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      # vue-tsc type check, Vite build and the PWA check.
      - run: pnpm -C web build
      - run: pnpm -C web test

  template:
    name: Template (astro-marketing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/astro-marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/astro-marketing/package-lock.json
      - run: npm ci
      # Builds the site, then runs scripts/*.test.mjs.
      - run: npm test

  package:
    name: orso-astro package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/astro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/astro/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      # Same as `just e2e`: the release daemon embeds the freshly built web/dist.
      - run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      - run: cargo build --release --locked
      - run: pnpm -C e2e install --frozen-lockfile
      - run: pnpm -C e2e exec playwright install --with-deps chromium
      - run: pnpm -C e2e test
      - run: pnpm -C e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7
