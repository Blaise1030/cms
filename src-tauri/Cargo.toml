[package]
name = "workbench-desktop"
version = "0.1.0"
edition = "2021"
description = "Workbench macOS desktop shell (Tauri) wrapping the workbench daemon sidecar"
publish = false

# Standalone: keeps the shell out of the root daemon package's build.
[workspace]

[lib]
name = "workbench_desktop_lib"

[features]
# Test-only hooks for scripts/update-e2e.sh. Never enable in release builds.
update-e2e = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.14.0"
libc = "=0.2.190"
serde_json = "=1.0.154"
zip = { version = "=9.0.3", default-features = false }

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
