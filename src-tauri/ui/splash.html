<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>orso</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        box-sizing: border-box;
        padding-top: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
        color: #666;
        background: Canvas;
      }
      .grid-loader {
        display: inline-grid;
        width: 28px;
        height: 28px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 8%;
      }
      .grid-loader > span {
        border-radius: 2px;
        background: currentColor;
        animation: grid-loader-pulse 1.2s ease-in-out infinite;
      }
      @keyframes grid-loader-pulse {
        0%,
        100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid-loader > span { animation-duration: 3s; }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <svg
      class="orso-logo"
      xmlns="http://www.w3.org/2000/svg"
      width="64"
      height="64"
      viewBox="1 1 22 22"
      fill="none"
      role="img"
      aria-label="Orso"
      data-tauri-drag-region
    >
      <defs>
        <g id="orso-paw-shapes">
          <circle cx="11" cy="4" r="2" />
          <circle cx="18" cy="8" r="2" />
          <circle cx="20" cy="16" r="2" />
          <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
        </g>
        <linearGradient id="orso-paw-metal" gradientUnits="userSpaceOnUse" x1="2" y1="1" x2="22" y2="23">
        <stop offset="0" stop-color="#c9cad4" />
        <stop offset="0.18" stop-color="#f6f7fb" />
        <stop offset="0.45" stop-color="#c2c3ce" />
        <stop offset="0.72" stop-color="#9a9ba7" />
        <stop offset="1" stop-color="#6f707c" />
        </linearGradient>
      </defs>
      <use href="#orso-paw-shapes" stroke="#23242b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
      <use href="#orso-paw-shapes" stroke="url(#orso-paw-metal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="grid-loader" role="status" aria-label="Loading">
      <span style="animation-delay: 0s"></span>
      <span style="animation-delay: 0.1s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.1s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.3s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.3s"></span>
      <span style="animation-delay: 0.4s"></span>
    </div>
    <div>Starting orso…</div>
  </body>
</html>
