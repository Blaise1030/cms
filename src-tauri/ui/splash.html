<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workbench</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        box-sizing: border-box;
        padding-top: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
        color: #666;
        background: Canvas;
      }
      .grid-loader {
        display: inline-grid;
        width: 28px;
        height: 28px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 8%;
      }
      .grid-loader > span {
        border-radius: 2px;
        background: currentColor;
        animation: grid-loader-pulse 1.2s ease-in-out infinite;
      }
      @keyframes grid-loader-pulse {
        0%,
        100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid-loader > span { animation-duration: 3s; }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div class="grid-loader" role="status" aria-label="Loading">
      <span style="animation-delay: 0s"></span>
      <span style="animation-delay: 0.1s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.1s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.3s"></span>
      <span style="animation-delay: 0.2s"></span>
      <span style="animation-delay: 0.3s"></span>
      <span style="animation-delay: 0.4s"></span>
    </div>
    <div>Starting Workbench…</div>
  </body>
</html>
